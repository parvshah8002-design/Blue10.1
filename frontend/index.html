<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SchemeSaathi — A simple, accessible citizen service portal to discover verified government schemes, understand eligibility rules, and prepare applications." />
    <title>SchemeSaathi — Citizen Welfare & Government Benefits Discovery Portal</title>
    <!-- Accessible Typography: Plus Jakarta Sans, Inter & Indic Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('schemesaathi-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          const lang = localStorage.getItem('schemesaathi-lang');
          if (lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ur' ? 'rtl' : 'ltr');
          } else {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F8FC] text-[#263445] antialiased selection:bg-[#168A83]/20 selection:text-[#173B67]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
